<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Self Study</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="glass-nav">
    <a href="index.html" class="logo">Self Study</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">🌙</button>
    </div>
  </nav>
  <main class="auth-container">
    <section class="glass-card">
      <h1>Welcome back</h1>
      <p class="form-intro">Log in to continue learning.</p>
      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" class="form-control" autocomplete="email" required maxlength="254">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control" autocomplete="current-password" required>
        </div>
        <p class="form-message" id="form-message" role="alert" aria-live="polite"></p>
        <button type="submit" class="btn btn-primary form-submit">Login</button>
      </form>
      <p class="auth-link">No account? <a href="register.html">Register here</a></p>
    </section>
  </main>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
